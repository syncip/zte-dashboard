name: Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: zte-dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-Check
        run: python3 -m py_compile zte_dash.py dev/mock_router.py

      - uses: docker/setup-qemu-action@v3        # für arm64 (Raspberry Pi)
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # README als Beschreibung auf Docker Hub: relative Bild-Pfade (docs/...) werden auf absolute GitHub-Adressen umgeschrieben
      - name: README für Docker Hub vorbereiten
        run: |
          RAW="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/"
          sed -e "s#](docs/#](${RAW}docs/#g" -e "s#src=\"docs/#src=\"${RAW}docs/#g" README.md > README.dockerhub.md
          wc -c README.dockerhub.md

      - name: Docker-Hub-Beschreibung aktualisieren
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
          readme-filepath: ./README.dockerhub.md
          short-description: "Dashboard für den ZTE G5TS 5G-Router: Signal, Datenverbrauch, Latenz, Watchdog, SMS-API"
